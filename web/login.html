<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Sierra Outfitters 🏔️</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #26312b;
    --muted: #6b7a70;
    --pine: #2f6b4f;
    --pine-dark: #244f3b;
    --border: #dcd7cb;
    --err: #b23b3b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(38,49,43,.08);
  }
  .card header {
    background: linear-gradient(135deg, var(--pine), var(--pine-dark));
    color: #f4f1ea;
    padding: 22px 24px;
  }
  .card header .brand { font-size: 1.2rem; font-weight: 700; }
  .card header .tag { font-size: .82rem; opacity: .85; margin-top: 2px; }
  form { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  label { font-size: .82rem; font-weight: 600; color: var(--muted); }
  input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    margin-top: 5px;
  }
  input:focus { border-color: var(--pine); }
  button {
    background: var(--pine);
    color: #f4f1ea;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button:hover { background: var(--pine-dark); }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--err); font-size: .85rem; min-height: 1.1em; }
  .hint { color: var(--muted); font-size: .78rem; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <div class="brand">Sierra Agent</div>
    </header>
    <form id="form">
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••" required />
      </div>
      <div class="error" id="error"></div>
      <button id="submit" type="submit">Sign in</button>
      <div class="hint">Demo access — password is <strong>1234</strong>.</div>
    </form>
  </div>

<script>
  const form = document.getElementById("form");
  const errorBox = document.getElementById("error");
  const submit = document.getElementById("submit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.textContent = "";
    submit.disabled = true;
    try {
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (data.ok) {
        window.location = "/";
      } else {
        errorBox.textContent = data.error || "Sign in failed.";
      }
    } catch (err) {
      errorBox.textContent = "Something went wrong — try again.";
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
