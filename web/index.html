<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Summit Outfitters 🏔️</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #26312b;
    --muted: #6b7a70;
    --pine: #2f6b4f;
    --pine-dark: #244f3b;
    --user: #2f6b4f;
    --user-ink: #f4f1ea;
    --bot: #eef2ec;
    --chip-bg: #e3ede6;
    --chip-ink: #2f6b4f;
    --border: #dcd7cb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--pine), var(--pine-dark));
    color: var(--user-ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { font-size: 1.15rem; font-weight: 700; }
  header .tag { font-size: .8rem; opacity: .85; font-weight: 400; }
  header .who { font-size: .74rem; opacity: .8; margin-top: 3px; }
  header .actions { display: flex; gap: 8px; }
  header button {
    background: rgba(255,255,255,.15);
    color: var(--user-ink);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: .8rem;
    cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,.28); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; flex-direction: column; max-width: 85%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    white-space: normal;
    word-wrap: break-word;
  }
  .user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--bot); color: var(--ink); border-bottom-left-radius: 4px; }
  .bubble a { color: inherit; text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip {
    background: var(--chip-bg);
    color: var(--chip-ink);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: .74rem;
    font-weight: 600;
  }
  .typing .bubble { color: var(--muted); font-style: italic; }
  form {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #msg {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: none;
    outline: none;
  }
  #msg:focus { border-color: var(--pine); }
  #send {
    background: var(--pine);
    color: var(--user-ink);
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="brand">Summit Agent</div>
        <div class="who" id="who"></div>
      </div>
      <div class="actions">
        <button id="reset" type="button">New chat</button>
        <button id="logout" type="button">Log out</button>
      </div>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="msg" rows="1" placeholder="Ask about an order, a recommendation, or the Early Risers promo…" autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("msg");
  const sendBtn = document.getElementById("send");

  // Escape HTML, then render the small slice of markdown the model actually uses.
  // Links become genuinely clickable here -- the thing the terminal render only
  // fakes as "text (url)".
  function renderMarkdown(text) {
    const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    // Links in ONE pass: match a markdown link OR a bare URL and emit the anchor
    // from a callback. Replacement output is never rescanned, so the URL we put
    // inside href="..." can't be picked up again and wrapped a second time
    // (that double-match was what leaked raw <a> attributes into the bubble).
    const linkRe = /\[([^\]]+)\]\(([^)]+)\)|(\bhttps?:\/\/[^\s<]+)/g;
    const anchor = (url, label) =>
      `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
    return esc
      .replace(linkRe, (match, label, mdUrl, bareUrl) => {
        if (bareUrl) {
          // Don't swallow sentence punctuation that trails a bare URL.
          const trail = (bareUrl.match(/[.,!?)\]]+$/) || [""])[0];
          const url = bareUrl.slice(0, bareUrl.length - trail.length);
          return anchor(url, url) + trail;
        }
        return anchor(mdUrl, label);
      })
      // Bold before italic, so the ** of **bold** is consumed first and the
      // leftover single-* rule can't chew a bold marker in half.
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+?)\*/g, "<em>$1</em>")
      // Underscore italics are deliberately NOT handled: `_` is common in emails,
      // SKUs, and URLs, and unwrapping them would mangle data (same call render.py makes).
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\n/g, "<br>");
  }

  function addRow(role, html, chips) {
    const row = document.createElement("div");
    row.className = "row " + role;
    if (chips && chips.length) {
      const strip = document.createElement("div");
      strip.className = "chips";
      chips.forEach((c) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = c;
        strip.appendChild(chip);
      });
      row.appendChild(strip);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = html;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row bot typing";
    row.innerHTML = '<div class="bubble">Scanning the trailhead…</div>';
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  async function send(text) {
    addRow("user", renderMarkdown(text));
    const typing = addTyping();
    sendBtn.disabled = true;
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      typing.remove();
      addRow("bot", renderMarkdown(data.reply || ""), data.tools);
    } catch (e) {
      typing.remove();
      addRow("bot", "I lost the trail for a moment — try that again. 🧭");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    send(text);
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    await fetch("/reset", { method: "POST" });
    log.innerHTML = "";
    loadGreeting();
  });

  document.getElementById("logout").addEventListener("click", async () => {
    await fetch("/logout", { method: "POST" });
    window.location = "/login";
  });

  async function loadGreeting() {
    try {
      const res = await fetch("/greeting");
      if (res.status === 401) { window.location = "/login"; return; }
      const data = await res.json();
      if (data.email) document.getElementById("who").textContent = "Signed in as " + data.email;
      addRow("bot", renderMarkdown(data.greeting || "Welcome to Summit Outfitters! 🏔️"));
    } catch (e) {
      addRow("bot", "Welcome to Summit Outfitters! 🏔️");
    }
    input.focus();
  }

  loadGreeting();
</script>
</body>
</html>
